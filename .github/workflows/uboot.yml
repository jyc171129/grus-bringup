name: grus-uboot

# Builds U-Boot for the Xiaomi Mi 9 SE (grus, SDM712) out of the 57UU fork, which
# already carries the SDM710 SoC support this phone needs.
#
# Two boards are always built:
#   sirius — Mi 8 SE, the board the fork was written for, known to boot on hardware.
#             If this one fails, the toolchain or the fork is at fault, not our port.
#   grus   — our board files from this repository, overlaid into the same tree.
# The control costs a few minutes and turns "it did not build" into a diagnosable
# statement instead of a guess.
#
# Choices that are deliberate:
#   * the U-Boot source is never committed here, only the board delta, so the
#     upstream clone stays the single source of truth for the SoC level;
#   * mkbootimg is not installed on the runner, so tools/mkbootimg.py packs;
#   * the build log is uploaded even when the build fails, because "missing dtb"
#     and "compiler not found" look identical from the outside.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: grus-uboot-${{ github.ref }}
  cancel-in-progress: true

env:
  UBOOT_REPO: https://github.com/57UU/u-boot
  UBOOT_REF: sirius/v2.0

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        board: [sirius, grus]
    steps:
      - name: Check out the board repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bison flex libssl-dev libgnutls28-dev device-tree-compiler bc python3
          aarch64-linux-gnu-gcc --version | head -1
          dtc --version

      - name: Clone U-Boot
        run: |
          git clone --depth 1 -b "$UBOOT_REF" "$UBOOT_REPO" u-boot
          git -C u-boot log -1 --oneline

      - name: Overlay the grus board delta
        if: matrix.board == 'grus'
        run: |
          mkdir -p u-boot/board/xiaomi/grus
          cp device/board/xiaomi/grus/grus.config \
             device/board/xiaomi/grus/grus.env \
             device/board/xiaomi/grus/MAINTAINERS \
             u-boot/board/xiaomi/grus/
          cp device/dts/upstream/src/arm64/qcom/sdm710-xiaomi-grus.dts \
             u-boot/dts/upstream/src/arm64/qcom/
          ls -l u-boot/board/xiaomi/grus/
          ls -l u-boot/dts/upstream/src/arm64/qcom/sdm710-xiaomi-grus.dts

      - name: Stop fastboot reboot-bootloader from lying
        run: |
          # History, so this is not tried a third time: fastboot_set_reboot_flag()
          # is __weak in drivers/fastboot/fb_common.c and its default body writes a
          # BCB to a block device. That failed while UFS was down, so this hook was
          # added to write the IMEM restart reason instead. It does not work on this
          # ABL either (see the comment in the appended code), and it had a nasty
          # failure mode: the client gets "rebooting into bootloader... OKAY" and
          # the phone goes to MIUI and hangs on the logo.
          #
          # Now that fastboot flash works from U-Boot itself, nothing needs to
          # leave U-Boot, so the hook is reduced to a loud refusal.
          # Appending to board.c instead of carrying a patch file keeps this a
          # pure addition: no context lines to rot when the fork moves.
          cat >> u-boot/arch/arm/mach-snapdragon/board.c <<'EOF'

          /* ---- grus bring-up: reboot straight into ABL fastboot ---- */
          #include <fastboot.h>
          #include <mapmem.h>
          #include <linux/errno.h>

          #define QCOM_IMEM_RESTART_REASON	0x146bf65cUL
          #define QCOM_RESTART_BOOTLOADER		0x77665500U

          /*
           * Measured on hardware on 2026-11-06, twice, both negative:
           *
           *   BCB "boot-recovery"      -> ABL boots the recovery partition
           *   BCB "bootonce-bootloader"-> ABL ignores it and boots boot (MIUI),
           *                               which then hangs on the Mi logo
           *
           * Writing the IMEM restart reason here did not change either outcome,
           * so this ABL does not take the AOSP paths. Do not spend another cycle
           * on it: fastboot flash now works from U-Boot itself, so there is no
           * reason to leave U-Boot at all.
           *
           * Returning an error keeps "fastboot reboot bootloader" honest - it
           * fails with a message instead of silently rebooting into MIUI.
           */
          int fastboot_set_reboot_flag(enum fastboot_reboot_reason reason)
          {
          	if (reason == FASTBOOT_REBOOT_REASON_BOOTLOADER) {
          		printf("grus: ABL has no working fastboot-reboot path; "
          		       "refusing to reset\n");
          		return -ENOTSUPP;
          	}

          	return 0;
          }
          EOF
          grep -n "QCOM_RESTART_BOOTLOADER" u-boot/arch/arm/mach-snapdragon/board.c

      - name: Add the misc/BCB command
        run: |
          # The loop this has to break: ABL looks at the BCB in /misc before it
          # ever looks at the IMEM restart reason. A "boot-recovery" command left
          # in misc therefore sends every reset to the recovery partition no
          # matter what we write into IMEM — and the recovery partition holds a
          # copy of U-Boot, so the phone comes straight back to this same
          # fastboot and the only escape is holding volume-down by hand.
          #
          # Now that UFS probes (see the clock step below), the BCB is writable
          # from U-Boot itself. blk_get_device_part_str("scsi", "0:misc", ...)
          # goes through the same GPT lookup that makes `part list scsi 0` work,
          # so the LBA is taken from the table instead of being hardcoded.
          #
          # "bootonce-bootloader" is the documented BCB value: ABL enters
          # fastboot and consumes it, so the flag is one-shot and cannot trap the
          # phone the way "boot-recovery" does.
          cat >> u-boot/arch/arm/mach-snapdragon/board.c <<'EOF'

          /* ---- grus bring-up: peek and rewrite the Android BCB in misc ---- */
          #include <blk.h>
          #include <command.h>
          #include <part.h>
          #include <linux/string.h>

          #define GRUS_BCB_LEN	32	/* command field, first member of struct */
          #define GRUS_BCB_BUF	4096

          static void grus_hex(const char *tag, const u8 *p, int len)
          {
          	int i;

          	printf("%s", tag);
          	for (i = 0; i < len; i++)
          		printf(" %02x", p[i]);
          	printf("\n");
          }

          static struct blk_desc *grus_misc_part(struct disk_partition *info)
          {
          	struct blk_desc *dev = NULL;

          	if (!blk_get_device_part_str("scsi", "0:misc", &dev, info, 1) && dev)
          		return dev;

          	if (blk_get_device_by_str("scsi", "0", &dev) || !dev)
          		return NULL;
          	part_init(dev);
          	if (part_get_info_by_name(dev, "misc", info) < 0)
          		return NULL;

          	return dev;
          }

          static int do_grus_misc(struct cmd_tbl *cmdtp, int flag, int argc,
          			char *const argv[])
          {
          	static u8 blk[GRUS_BCB_BUF] __aligned(4096);
          	char *command = (char *)blk;	/* struct bootloader_message */
          	struct disk_partition info;
          	struct blk_desc *dev;
          	const char *what = (argc > 1) ? argv[1] : "show";

          	if (strcmp(what, "show") && strcmp(what, "clear") &&
          	    strcmp(what, "bootloader")) {
          		printf("usage: grus_misc [show|clear|bootloader]\n");
          		return CMD_RET_FAILURE;
          	}

          	dev = grus_misc_part(&info);
          	if (!dev) {
          		printf("grus: scsi 0:misc not found\n");
          		return CMD_RET_FAILURE;
          	}
          	printf("grus: misc lba=%llu blksz=%u\n",
          	       (unsigned long long)info.start, (unsigned)dev->blksz);

          	if (blk_dread(dev, info.start, 1, blk) != 1) {
          		printf("grus: misc read failed\n");
          		return CMD_RET_FAILURE;
          	}
          	printf("grus: bcbc md='%.32s'\n", command);
          	grus_hex("grus: bcb:", blk, 48);

          	if (!strcmp(what, "show"))
          		return CMD_RET_SUCCESS;

          	memset(blk, 0, sizeof(blk));
          	if (!strcmp(what, "bootloader"))
          		strncpy(command, "bootonce-bootloader", GRUS_BCB_LEN - 1);

          	if (blk_dwrite(dev, info.start, 1, blk) != 1) {
          		printf("grus: misc write failed\n");
          		return CMD_RET_FAILURE;
          	}

          	/* Read back through the driver, not from our own buffer: a cache
          	 * that lies about the write is exactly what we need to catch. */
          	memset(blk, 0xee, sizeof(blk));
          	if (blk_dread(dev, info.start, 1, blk) != 1) {
          		printf("grus: misc read-back failed\n");
          		return CMD_RET_FAILURE;
          	}
          	printf("grus: cmd after='%.32s'\n", command);
          	grus_hex("grus: new:", blk, 48);

          	return CMD_RET_SUCCESS;
          }

          U_BOOT_CMD(grus_misc, 2, 0, do_grus_misc,
          	   "peek or rewrite the Android BCB in the misc partition",
          	   "[show|clear|bootloader]");
          EOF
          grep -n "U_BOOT_CMD(grus_misc" u-boot/arch/arm/mach-snapdragon/board.c

      - name: Let fastboot flash through the SCSI/UFS block device
        run: |
          # This is the step that removes the whole "reboot back to ABL" problem.
          #
          # drivers/fastboot/fb_mmc.c resolves its block device with
          # blk_get_dev("mmc", CONFIG_FASTBOOT_FLASH_MMC_DEV). grus has no eMMC at
          # all - its storage is UFS, which U-Boot enumerates as SCSI - so every
          # flash and every `getvar partition-size:*` fails with
          # "invalid partition or device" even though `part list scsi 0` reads the
          # GPT fine. That is why nothing could ever be written from U-Boot and
          # why every payload had to go through ABL.
          #
          # Falling back to the scsi interface makes `fastboot flash <part> <file>`
          # work inside our own U-Boot, so no reboot and no key combo is needed to
          # install anything. The mmc lookup is kept first in case a future board
          # really does have eMMC.
          python3 - <<'PY'
          import re, sys

          p = 'u-boot/drivers/fastboot/fb_mmc.c'
          src = open(p).read()

          hits = [(i, l) for i, l in enumerate(src.split('\n'), 1)
                  if 'blk_get_dev' in l]
          print('--- block-device lookups in fb_mmc.c ---')
          for i, l in hits:
              print('%4d %s' % (i, l.strip()))
          if not hits:
              sys.exit('no blk_get_dev() in fb_mmc.c - the fork changed the API, '
                       'look at the file before patching')

          helper = '''
          /* grus bring-up: this phone's storage is UFS, which U-Boot enumerates
           * as SCSI. fb_mmc asks for "mmc" and gets NULL, which made every flash
           * and every partition-size getvar fail. Fall back to scsi. */
          static struct blk_desc *grus_fastboot_dev(void)
          {
          	struct blk_desc *dev;

          	dev = blk_get_dev("mmc", CONFIG_FASTBOOT_FLASH_MMC_DEV);
          	if (dev && dev->type != DEV_TYPE_UNKNOWN)
          		return dev;

          	return blk_get_dev("scsi", CONFIG_FASTBOOT_FLASH_MMC_DEV);
          }
          '''

          # Insert right after the last #include so the helper is declared before
          # every use, without touching any existing function body.
          lines = src.split('\n')
          last_inc = max(i for i, l in enumerate(lines) if l.startswith('#include'))
          lines.insert(last_inc + 1, helper)
          src = '\n'.join(lines)

          src, n = re.subn(r'blk_get_dev\(\s*"mmc"\s*,\s*[^)]*\)',
                           'grus_fastboot_dev()', src)
          print('replaced %d mmc lookup(s)' % n)
          if n == 0:
              sys.exit('pattern did not match - patch not applied')

          open(p, 'w').write(src)
          PY
          grep -n "grus_fastboot_dev" u-boot/drivers/fastboot/fb_mmc.c

      - name: Restore the UFS lane-1 symbol clock for SDM670
        run: |
          # Measured on the phone, with preboot diagnostics piped out through
          # fastboot oem console:
          #
          #   gcc@0x100000: unknown clock ID 137!
          #   Controller enable notify PRE_CHANGE failed: -2
          #   ufshcd_probe() failed, ret:-2
          #
          # 137 is GCC_UFS_PHY_RX_SYMBOL_1_CLK. sdm845_clks[] has it, but the
          # SDM670 table that sdm710.dtsi binds to (compatible qcom,gcc-sdm670)
          # never lists it, so clk_enable_bulk() fails with -ENOENT and the UFS
          # controller never leaves reset. Both SoCs share the SDM845 GCC
          # register map, so the entry is the same one, cbcr 0x770a8.
          python3 - <<'PY'
          p = 'u-boot/drivers/clk/qcom/clock-sdm845.c'
          lines = open(p).read().split('\n')
          for i, l in enumerate(lines):
              if 'GCC_UFS_PHY_RX_SYMBOL_0_CLK' in l:
                  indent = l[:len(l) - len(l.lstrip())]
                  lines.insert(i + 1, indent +
                               'GATE_CLK(GCC_UFS_PHY_RX_SYMBOL_1_CLK,\t\t0x770a8, 0x00000001),')
                  print('inserted after line', i + 1)
                  break
          else:
              raise SystemExit('anchor GCC_UFS_PHY_RX_SYMBOL_0_CLK not found')
          open(p, 'w').write('\n'.join(lines))
          PY
          grep -n "RX_SYMBOL_1_CLK" u-boot/drivers/clk/qcom/clock-sdm845.c

      - name: Build ${{ matrix.board }}
        env:
          # Passed explicitly: build.sh defaults to $PWD/u-boot, and relying on
          # the caller's working directory is the kind of thing that silently
          # builds the wrong tree.
          SRC: ${{ github.workspace }}/u-boot
          OUT: ${{ github.workspace }}/out/${{ matrix.board }}
        run: |
          set -o pipefail
          chmod +x device/build.sh
          device/build.sh "${{ matrix.board }}" 2>&1 | tee build-${{ matrix.board }}.log

      - name: Pack boot image
        env:
          BOARD: ${{ matrix.board }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'device/tools')
          import mkbootimg
          board = os.environ['BOARD']
          out = 'out/' + board
          payload = open(os.path.join(out, 'uboot-payload'), 'rb').read()
          # base 0x10000000 + --kernel_offset 0x8000, the combination
          # sirius-build.sh uses.  Header v1: our packer emits the 1648-byte
          # v1 layout, and v1 is also what this bootloader accepts in recovery.
          img = mkbootimg.build(payload, b'', header_version=1,
                                kernel_addr=0x10008000, ramdisk_addr=0x11000000,
                                tags_addr=0x10000100, page=4096,
                                cmdline='', name=board)
          path = os.path.join(out, 'boot-%s.img' % board)
          open(path, 'wb').write(img)
          print('%s  %d bytes' % (path, len(img)))
          PY

      - name: Report
        if: always()
        run: |
          echo "--- out/${{ matrix.board }} ---"
          ls -l "out/${{ matrix.board }}" 2>/dev/null | head -40 || echo "(no output dir)"
          echo "--- build log tail ---"
          tail -40 "build-${{ matrix.board }}.log" 2>/dev/null || echo "(no log)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uboot-${{ matrix.board }}-${{ github.run_number }}
          path: |
            out/${{ matrix.board }}/u-boot-nodtb.bin
            out/${{ matrix.board }}/u-boot-nodtb.bin.gz
            out/${{ matrix.board }}/uboot-payload
            out/${{ matrix.board }}/boot-${{ matrix.board }}.img
            out/${{ matrix.board }}/dts/upstream/src/arm64/qcom/*.dtb
            out/${{ matrix.board }}/.config
            build-${{ matrix.board }}.log
          if-no-files-found: warn
          retention-days: 14
